name: "github-pages"

# Deploys the browser version of ZMK Studio DcpEdit to GitHub Pages.
# The web app talks to keyboards over Web Serial / Web Bluetooth, so no
# download is needed in Chrome or Edge.
#
# One-time setup: Settings → Pages → Source: "GitHub Actions".

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel a deploy that is mid-flight.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: install frontend dependencies
        run: npm ci

      - name: build web app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ github.repository }}
          # Project Pages are served from https://<owner>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
